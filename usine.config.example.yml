# Le contrat de l'usine logicielle. Copié une fois en usine.config.yml (non suivi
# par Git) : chaque installation fixe ses propres règles. Ces limites sont
# appliquées par le CODE de l'orchestrateur, pas laissées au bon vouloir des agents.

github:
  proprietaire: Tgnima          # compte ou organisation qui reçoit les dépôts des produits
  visibilite: private           # private | public
  depot_etat: usine-etat        # le dépôt de l'état souhaité, que le déployeur tire

domaine:
  # Aperçus : <produit>.apercu.<base>  ·  production : <produit>.<base>
  # sslip.io résout tout seul vers l'IP du serveur : aucun DNS à configurer pour la démo.
  base: 45-93-21-17.sslip.io
  https: true

modeles:
  analyste:      { moteur: claude-code, modele: claude-opus-5-5 }
  atelier:       { moteur: claude-code, modele: claude-sonnet-5-5 }
  verificateur:  { moteur: codex }
  petites_taches: { moteur: claude-code, modele: claude-haiku-4-5 }
  # Le produit lui-même, quand il appelle un modèle (via Vercel AI Gateway).
  produit:       { modele: anthropic/claude-sonnet-5.5 }
  # Quand une tâche change d'approche (les corrections n'ont pas suffi), un modèle plus fort.
  renfort:       { moteur: claude-code, modele: claude-opus-5-5 }
  # Facultatifs : la recherche des personas (défaut : l'analyste) et l'inventaire d'un dépôt
  # repris (défaut : le renfort ; une erreur d'inventaire coûte toute la reprise).
  # chercheur:   { moteur: claude-code, modele: claude-opus-5-5 }
  # inventaire:  { moteur: claude-code, modele: claude-opus-5-5 }

autonomie:
  tentatives_par_tache: 2          # corrections après un refus du vérificateur
  changements_d_approche: 1        # puis on repart de zéro avec une autre approche ; puis escalade
  lignes_max_par_pr: 800           # au-delà : signalé dans la PR (non bloquant en démo)
  minutes_max_par_agent: 30
  budget_par_projet:
    duree_max_heures: 8
  arret: dependances               # dependances : seules les tâches liées s'arrêtent | projet
  relance_apres_heures: 24

politiques:                        # jamais | manuel | sur-criteres
  implementer: sur-criteres
  merger: sur-criteres
  deployer_apercu: sur-criteres
  mettre_en_production: manuel     # toujours un humain
  supprimer_des_donnees: jamais

# L'usine ne peut pas modifier ce qui la juge : une tâche qui y touche est refusée.
perimetre_protege:
  - Dockerfile
  - test/sante.test.js
  - server/index.js
  - server/email.js                 # la barrière des destinataires
  - server/securite.js              # en-têtes, limitation des requêtes, erreurs sans détail
  - test/securite.test.js
  - docs/PLAN.md
  - docs/DESIGN.md
  - .usine/**

demo:
  actif: true
  vitesse_horloge: 1440            # un jour passe en une minute dans les produits
  services: [mailpit]              # Mailpit capture tous les emails des produits

# La production, réglée par défaut ici. Au moment de valider (bouton Slack), la
# personne peut changer chacun de ces choix pour ce produit.
production:
  donnees: demo                    # demo : remplie de données fictives au 1er démarrage | vide : base vide
  emails: captures                 # captures : Mailpit, rien ne sort | reels : service d'envoi SMTP (.env)
  horloge: acceleree               # acceleree : vitesse_horloge de la démo | reelle : le vrai temps
  # Avec emails: reels, seuls ces destinataires reçoivent (adresses ou « @domaine »).
  # Vide = tout le monde : à éviter tant qu'on teste avec des contacts de test.
  destinataires_autorises: []

# Ce que coûte l'usine. Ces montants se règlent aussi depuis Slack (onglet Accueil,
# « Réglages des coûts ») : ce qui est réglé dans Slack l'emporte sur ce fichier.
couts:
  devise: EUR                      # EUR | USD : la devise d'affichage, et celle des montants ci-dessous
  taux_usd: 0.86                   # 1 $ = 0,86 € : pour convertir les équivalents API (donnés en dollars)
  # Les frais fixes mensuels, répartis entre les projets au prorata de leur usage.
  abonnements:
    - { nom: "Claude (Pro/Max)", mensuel: 0, moteurs: [claude-code] }   # à renseigner
    - { nom: "ChatGPT (Codex)",  mensuel: 0, moteurs: [codex] }         # à renseigner
  serveur_mensuel: 0               # le VPS, à renseigner
  # Équivalent API des moteurs qui ne donnent pas leur prix ($ par million de jetons).
  # Claude Code donne le sien : rien à mettre pour les modèles Claude.
  prix_api:
    anthropic/claude-haiku-4.5: { entree: 1, sortie: 5 }               # l'aiguillage, via la passerelle
    # gpt-6.1-sol: { entree: 0, sortie: 0 }                            # le modèle de Codex, si tu veux son équivalent API

# Les budgets, en équivalent API (c'est lui qui mesure l'usage réel des abonnements).
# 0 = pas de budget. Alertes Slack aux seuils ; à 100 % : escalade (Continuer / Arrêter).
budget:
  mensuel: 0                       # pour toute l'usine, par mois civil
  par_projet: 0                    # pour un projet, de l'analyse aux corrections
  alertes: [50, 80, 100]

# La durée de vie des aperçus, pour tenir sur un petit serveur : un aperçu est retiré
# après ce nombre de jours sans activité sur le projet (rappel dans Slack 24 h avant :
# Prolonger / Garder / Retirer). La production n'est jamais retirée automatiquement.
apercus:
  duree_vie_jours: 7

# Les limites d'usage des abonnements : quand une façon d'utiliser un moteur est à sa limite,
# l'usine passe à la suivante pour le même travail, puis revient à l'abonnement après sa
# réinitialisation. Toutes épuisées : pause sans consommer de tentative, reprise automatique.
#   abonnement (Claude Pro/Max, ChatGPT) · cle (ANTHROPIC_API_KEY / OPENAI_API_KEY) · passerelle (AI_GATEWAY_API_KEY)
secours:
  ordre: [abonnement, cle, passerelle]
  modele_codex_passerelle: openai/gpt-5.5   # le vérificateur via la passerelle
  # modeles_passerelle: { claude-sonnet-5-5: claude-sonnet-5-5 }   # si un nom diffère sur la passerelle

# Le lot de finition : avant le rapport final, un dernier lot de polissage (design, textes,
# états vides, mobile) construit à partir des remarques du relecteur design. Une fois par projet.
finition: true
