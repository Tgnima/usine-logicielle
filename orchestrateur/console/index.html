<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Console de l'usine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/console.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f97e0'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' fill='white' text-anchor='middle'%3EU/%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="cote" id="cote">
    <div class="cote-haut">
      <a class="marque" href="#/">
        <span class="logo mono" aria-hidden="true">U/</span>
        <span><strong>Usine logicielle</strong><small class="mono" id="base">…</small></span>
      </a>
      <button type="button" class="btn-icone menu-mobile" data-action="menu" aria-expanded="false" aria-controls="cote-corps" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="cote-corps" id="cote-corps">
      <a class="btn btn-p nouveau-projet" href="#/nouveau"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouveau projet</a>
      <nav class="nav" aria-label="Démarrage">
        <a href="#/demarrer" data-nav="demarrer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg>Premiers pas</a>
      </nav>
      <nav class="projets-cote" aria-labelledby="titre-projets">
        <div class="barre"><span class="surtitre" id="titre-projets">Projets</span><a class="aide" href="#/projets" data-nav="projets">Tout voir</a></div>
        <ul id="liste-projets"></ul>
      </nav>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#/personas" data-nav="personas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 4.5-6.5 8-6.5s6.5 2 8 6.5"/></svg>Publics</a>
        <a href="#/reglages" data-nav="reglages"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</a>
      </nav>
      <div class="cote-bas" id="cote-bas"></div>
    </div>
  </aside>
  <main class="principal" id="principal" tabindex="-1">
    <div id="messages" aria-live="polite"></div>
    <div id="vue" style="display:flex;flex-direction:column;gap:24px"><div class="chargement">Chargement de la console…</div></div>
  </main>
</div>
<dialog class="palette" id="palette" aria-label="Commandes">
  <label class="cache" for="palette-saisie">Rechercher une commande ou un projet</label>
  <input id="palette-saisie" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-liste" aria-autocomplete="list" placeholder="Rechercher un projet ou une page…">
  <ul id="palette-liste" role="listbox" aria-label="Résultats"></ul>
</dialog>
<script type="module" src="/console.js"></script>
</body>
</html>
