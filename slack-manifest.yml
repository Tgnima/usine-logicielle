# Créer l'application : https://api.slack.com/apps -> Create New App -> From a manifest.
# Puis : Install to Workspace (jeton xoxb- = SLACK_BOT_TOKEN), et Basic Information ->
# App-Level Tokens -> Generate, portée connections:write (jeton xapp- = SLACK_APP_TOKEN).
display_information:
  name: Usine logicielle
  description: Du prompt au produit en ligne, avec deux validations humaines.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  bot_user:
    display_name: Usine logicielle
    always_online: true
  slash_commands:
    - command: /usine
      description: Construire un produit à partir d'une demande
      usage_hint: "<ce que tu veux construire> | corriger <n°> … | couts [n°] | tableau | statut | stop | reprendre"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands
      - bookmarks:read      # le signet « Tableau de bord » en haut du canal
      - bookmarks:write
      - channels:history    # lire les réponses dans le fil d'un projet
      - groups:history      # (canaux privés aussi)
      - users:read          # le nom de qui répond
      - files:write         # les captures d'écran d'un lot livré
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.channels    # les réponses dans les fils
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
